<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="Submit a student accommodation enquiry with Student Stay SA based on your campus and monthly budget."
>
<meta
    name="keywords"
    content="student accommodation enquiry, campus accommodation, Johannesburg student rooms"
>

<meta name="robots" content="index, follow">
   <title>Accommodation Enquiry | Student Stay SA</title>
   <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
   <script src="assets/js/script.js"></script>
   <header class="site-header">
      <div class="container header-inner">
         <a class="logo" href="index.html">Student Stay SA</a>
         <nav aria-label="Main navigation">
            <ul class="nav-list">
               <li><a class="" href="index.html">Home</a></li>
               <li><a class="" href="listings.html">Listings</a></li>
               <li><a class="" href="about.html">About Us</a></li>
               <li><a class="active" href="enquiry.html">Enquiry</a></li>
               <li><a class="" href="contact.html">Contact</a></li>
            </ul>
         </nav>
      </div>
   </header>
   <main>
      <section class="page-banner">
         <div class="container">
            <h1>Accommodation Enquiry</h1>
            <p>Tell us what type of accommodation you are looking for.</p>
         </div>
      </section>
      <section>
         <div class="container">
            <form id="enquiryForm" method="post">
               <div class="form-grid">
                  <div class="form-group"><label for="enquiryName">Full name</label><input id="name" name="name" type="text" placeholder="Enter your full name" minlength="2"
                        required></div>
                  <div class="form-group"><label for="enquiryEmail">Email address</label><input id="email" name="email" type="email" placeholder="Enter your email address"
                        type="email" required></div>
                  <div class="form-group"><label for="campus">Campus / institution</label><select id="campus"
                        name="campus" required>
                        <option value="Select your campus">Select your campus</option>
                        <option value="Rosebank College">Rosebank College</option>
                        <option value="University of Johannesburg">University of Johannesburg</option>
                        <option value="Wits University">Wits University</option>
                        <option value="Other">Other</option>
                     </select></div>
                  <div class="form-group"><label for="enquiryBudget">Monthly budget</label><select id="budget" name="budget" placeholder="e.g. 3500" min="1"
                        required>
                        <option value="">Select a budget</option>
                        <option value="3000">Below R3,000</option>
                        <option value="3500">R3,000 - R3,500</option>
                        <option value="4000">R3,500 - R4,000</option>
                        <option value="4500">Above R4,500</option>
                     </select></div>
                  <div class="form-group full"><label for="enquiryMessage">Enquiry message</label><textarea id="enquiryMessage" name="message" rows="5" placeholder="Tell us about the type of accommodation you are looking for"
                         required></textarea></div>
               </div>
               <div class="form-actions"><button class="button" type="submit">Submit Enquiry</button><button
                     class="button secondary" type="reset">Clear Form</button>
                 <p
    id="enquiryFeedback"
    class="form-feedback"
    aria-live="polite"
></p> </div>
            </form>
         </div>
      </section>
   </main>
   <footer class="site-footer">
      <div class="container footer-inner">
         <p>&copy; 2026 Student Stay SA. Academic project.</p>
         <p><a href="contact.html">Contact Student Stay SA</a></p>
      </div>
   </footer>
</body>

</html>
